version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: '09:30'
      timezone: Asia/Shanghai
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      supabase:
        patterns: ['@supabase/*']
        update-types: [minor, patch]
      oxlint:
        patterns: [oxlint, oxlint-tsgolint]
        update-types: [minor, patch]
      development-tools:
        dependency-type: development
        patterns: ['@types/node', c8, lint-staged, playwright, prettier, sigstore, tsx, typescript]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: '10:00'
      timezone: Asia/Shanghai
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ['*']
